[project]
name = "projeto-assistente-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Renan Ducasble", email = "renanducasble2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "google-generativeai>=0.8.6",
    "gradio>=6.30.0",
    "ipywidgets>=8.1.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.7.1",
    "openai>=3.29.0",
    "tqdm>=4.70.1",
]

[project.scripts]
projeto-assistente-python = "projeto_assistente_python:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
